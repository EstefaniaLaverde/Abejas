# Config de referencia para Nginx como proxy inverso hacia abejas-server,
# pensada para una VM "Always Free" de Oracle Cloud (o cualquier VPS).
#
# Uso:
#   1. Reemplaza TU-DOMINIO-AQUI por tu subdominio de sslip.io (ver README,
#      sección "Despliegue").
#   2. Copia este archivo a /etc/nginx/sites-available/abejas y enlázalo:
#        sudo cp deploy/nginx-abejas.conf /etc/nginx/sites-available/abejas
#        sudo ln -s /etc/nginx/sites-available/abejas /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx
#   3. Corre certbot para agregar HTTPS automáticamente:
#        sudo certbot --nginx -d TU-DOMINIO-AQUI
#      (certbot reescribe este archivo agregando el bloque SSL; no hace
#      falta tocarlo a mano después de eso)

server {
    listen 80;
    server_name TU-DOMINIO-AQUI;

    location / {
        proxy_pass http://127.0.0.1:2567;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
